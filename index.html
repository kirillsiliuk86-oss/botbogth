<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bandit Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f1014;
            --card: #1c1d24;
            --primary: #ff5722;
            --text: #ffffff;
            --muted: #8e8e93;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
            -webkit-tap-highlight-color: transparent;
        }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .avatar {
            width: 50px; height: 50px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #ff9800);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 22px;
        }
        .name { font-size: 20px; font-weight: 700; }
        .level { font-size: 13px; color: var(--muted); }
        
        .balance-card {
            background: linear-gradient(145deg, var(--card), #15161a);
            border: 1px solid #2c2d35;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .balance-label { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;}
        .balance-amount { font-size: 42px; font-weight: 800; color: var(--text); margin: 10px 0; }
        
        .stats { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 15px; flex: 1; margin: 0 5px; text-align: center; border: 1px solid #2c2d35;}
        .stat-val { font-size: 18px; font-weight: bold; color: var(--primary); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card-btn {
            background-color: var(--card);
            border-radius: 18px; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid #2c2d35;
            cursor: pointer; transition: 0.2s;
        }
        .card-btn:active { transform: scale(0.95); background-color: #25262e; }
        .card-btn svg { width: 40px; height: 40px; fill: var(--primary); margin-bottom: 10px; }
        .card-title { font-size: 15px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <div class="avatar" id="avatar">?</div>
        <div>
            <div class="name" id="name">Загрузка...</div>
            <div class="level" id="job">Безработный</div>
        </div>
    </div>

    <div class="balance-card">
        <div class="balance-label">Твой баланс</div>
        <div class="balance-amount" id="balance">0 $</div>
    </div>

    <div class="stats">
        <div class="stat-box">
            <div class="stat-val" id="level">1</div>
            <div class="balance-label" style="font-size:10px;">Уровень</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" id="energy">100</div>
            <div class="balance-label" style="font-size:10px;">Энергия</div>
        </div>
    </div>

    <div class="grid">
        <div class="card-btn" onclick="doWork()">
            <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
            <div class="card-title">Работать</div>
        </div>
        <div class="card-btn" onclick="alert('Скоро!')">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 7.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5S6 9.83 6 9s.67-1.5 1.5-1.5zm9 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm-9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm9-9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <div class="card-title">Казино</div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let userId = tg.initDataUnsafe?.user?.id;
        
        if (userId) {
            loadProfile();
        } else {
            document.getElementById('name').innerText = "Тест";
        }

        async function loadProfile() {
            let res = await fetch(`/api/profile/${userId}`);
            let data = await res.json();
            if(data.error) return;
            
            document.getElementById('name').innerText = data.nickname;
            document.getElementById('avatar').innerText = data.nickname[0];
            document.getElementById('balance').innerText = data.balance.toLocaleString() + " $";
            document.getElementById('energy').innerText = data.energy;
            document.getElementById('level').innerText = data.level;
            document.getElementById('job').innerText = data.job;
        }

        async function doWork() {
            let res = await fetch(`/api/work/${userId}`);
            let data = await res.json();
            
            if (data.error) {
                tg.showAlert(data.error);
            } else {
                tg.showAlert(`Вы заработали ${data.earned} $!`);
                loadProfile(); // Обновляем цифры на экране
            }
        }
    </script>
</body>
</html>
